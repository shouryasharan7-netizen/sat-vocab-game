<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Dark modern background with a sleek rounded squircle shape -->
  <rect width="512" height="512" rx="120" fill="url(#bg-gradient)"/>
  
  <!-- Glowing aura behind the book -->
  <circle cx="256" cy="256" r="140" fill="url(#glow)" opacity="0.6"/>

  <!-- The Book Base -->
  <path d="M256 360 C 256 360, 160 380, 120 380 C 100 380, 90 370, 90 350 L 90 180 C 90 160, 100 150, 120 150 C 160 150, 256 200, 256 200" fill="url(#book-left)"/>
  <path d="M256 360 C 256 360, 352 380, 392 380 C 412 380, 422 370, 422 350 L 422 180 C 422 160, 412 150, 392 150 C 352 150, 256 200, 256 200" fill="url(#book-right)"/>

  <!-- The Pages (Inner highlights) -->
  <path d="M110 350 L 110 180 C 110 170, 115 165, 125 165 C 160 165, 246 210, 246 210 L 246 365 C 246 365, 150 345, 125 345 C 115 345, 110 355, 110 350 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M402 350 L 402 180 C 402 170, 397 165, 387 165 C 352 165, 266 210, 266 210 L 266 365 C 266 365, 362 345, 387 345 C 397 345, 402 355, 402 350 Z" fill="#ffffff" opacity="0.9"/>

  <!-- The Center Spark / Knowledge Flame -->
  <path d="M256 120 L 280 200 L 360 210 L 290 260 L 310 340 L 256 290 L 202 340 L 222 260 L 152 210 L 232 200 Z" fill="url(#spark)" transform="translate(0, -20) scale(1.1)"/>
  
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <radialGradient id="glow" cx="256" cy="256" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="book-left" x1="90" y1="150" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <linearGradient id="book-right" x1="422" y1="150" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <linearGradient id="spark" x1="256" y1="120" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
</svg>